{% extends "base.html" %}
{% block title %}steam-lens — search{% endblock %}
{% block content %}
<section class="search">
  <h1>steam-lens</h1>
  <p class="tagline">Type a game name, get the report.</p>
  <form class="search-form" id="search-form">
    <input type="search" id="search-input" name="q" placeholder="game name"
           autocomplete="off" autofocus>
    <button type="submit">Search</button>
  </form>
  <p class="status" id="search-status" hidden></p>
  <ul class="results" id="search-results"></ul>
</section>
<script src="/static/search.js"></script>
{% endblock %}
