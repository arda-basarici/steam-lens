name: CI

# Lint, type-check, and test the library on every push and PR. The pytest run
# includes the import-graph test (the two-track wall) and all doctests. On a
# green main push the image job then builds the deploy unit and pushes it to
# GHCR — `needs: check` is load-bearing: the box only ever runs an image that
# passed CI, so a red commit must never mint a `latest`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact tag: setup-uv stopped publishing floating major tags (@v9
      # resolves to nothing) — bumps here are deliberate edits, not drift.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Pyright (types, strict)
        run: uv run pyright

      # STEAMLENS_EVAL_GATE arms the D3 eval gate (tests/test_eval_gate.py):
      # rebuild a throwaway store from the committed fixture (eval/ci/) and
      # regenerate the pinned eval runs to the digit. Deterministic re-scoring
      # of stored envelopes — any drift is code/scorer/artifact drift and fails.
      - name: Pytest (tests + import graph + doctests + the eval gate)
        run: uv run pytest -q
        env:
          STEAMLENS_EVAL_GATE: "1"

  image:
    # Push-to-main only: PRs get checked, never published.
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The provenance stamp the Dockerfile refuses to build without — the
      # same short-sha identity dev builds mint from their working tree.
      - name: Mint the code-version stamp
        id: stamp
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged latest + sha: the box tracks latest; rollback is pointing the
      # compose file at the previous sha tag.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            CODE_VERSION=${{ steps.stamp.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.stamp.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
