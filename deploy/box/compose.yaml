# The box-owned proxy stack (DESIGN, "The box") — Caddy runs ONCE per host,
# owned by no project: every project's stack joins the shared `web` network
# (created once per host: `docker network create web`) and gets a Caddyfile
# stanza. This directory rides the steamlens repo as provision-as-code, but
# on the box it lives outside any one project's deploy dir — first project
# in carries it.
name: box-proxy

services:
  caddy:
    # Major-version float: Caddy 2's config surface is the contract we wrote
    # the Caddyfile against; patch/minor security fixes arrive on re-pull.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The Cloudflare Origin CA pair (cert + key), scp'd to the box, never
      # committed — re-issuable from the dashboard at any time, so box-side
      # files are the whole story.
      - ./certs:/etc/caddy/certs:ro
      # Named volumes, not bind mounts: certificates and ACME account state
      # are Caddy's own, survive recreation, and nothing outside reads them.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    external: true
